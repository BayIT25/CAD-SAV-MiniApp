
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>CAD SAV</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 18px;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #222);
  }

  .container {
    max-width: 520px;
    margin: auto;
  }

  h2 { margin-bottom: 5px; }

  .version {
    font-size: 12px;
    opacity: .65;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
  }

  input, textarea, button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 9px;
    font-family: inherit;
  }

  input, textarea {
    background: var(--tg-theme-secondary-bg-color, #fff);
    color: var(--tg-theme-text-color, #222);
    border: 1px solid #aaa;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  button {
    border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
  }

  button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .secondary {
    background: #e8edf3;
    color: #223;
  }

  .panel {
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
  }

  .status {
    font-size: 13px;
    line-height: 1.6;
    margin-top: 12px;
  }

  #barcodeReader { width: 100%; }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    direction: ltr;
    text-align: left;
  }
</style>
</head>

<body>
<div class="container">

  <h2>🔧 CAD SAV</h2>
  <div class="version">Réception SAV — V1.02</div>

  <label for="serial">الرقم التسلسلي — Serial Number</label>
  <input
    id="serial"
    type="text"
    maxlength="120"
    dir="ltr"
    autocomplete="off"
    placeholder="Serial Number"
  >

  <button type="button" onclick="scanQR()">
    📷 مسح QR Code
  </button>

  <button type="button" onclick="scanBarcode()">
    📷 مسح Barcode
  </button>

  <!-- BARCODE -->
  <div id="barcodePanel" class="panel" hidden>

    <div id="barcodeReader"></div>

    <p id="barcodeStatus" class="status"></p>

    <label for="barcodeFile">أو اختر صورة للباركود</label>

    <input
      id="barcodeFile"
      type="file"
      accept="image/*"
      onchange="readBarcodeImage(this)"
    >

    <button type="button"
            class="secondary"
            onclick="stopBarcode()">
      إغلاق الماسح
    </button>
  </div>

  <!-- OCR -->
  <div class="panel">

    <label for="ocrFile">
      قراءة الرقم المطبوع — OCR
    </label>

    <input
      id="ocrFile"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="readSerialOCR(this)"
    >

    <p id="ocrStatus" class="status"></p>

    <details id="ocrDetails" hidden>
      <summary>عرض النص المستخرج</summary>
      <pre id="ocrText"></pre>
    </details>

  </div>

  <label for="issue">وصف العطل</label>

  <textarea
    id="issue"
    maxlength="1000"
    placeholder="Description de panne"
  ></textarea>

  <button id="saveButton"
          type="button"
          onclick="saveSAV()">
    💾 حفظ في Google Sheets
  </button>

  <button type="button"
          class="secondary"
          onclick="clearForm()">
    🧹 تفريغ البطاقة
  </button>

  <p id="status" class="status"></p>

</div>

<script>
"use strict";

/* ===============================
   1. CONFIGURATION
================================ */

const APP_VERSION = "1.02";

const API_URL =
  "https://script.google.com/macros/s/AKfycbwjwfFZEjoFoFWq8_2UqucHkAKu1GGoC3JTClCLBJcHJBmPwRdD7eixObv_MkKKUQMh/exec";

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const $ = id => document.getElementById(id);

function alertUser(message) {
  if (tg?.showAlert && tg.initData) {
    tg.showAlert(message);
  } else {
    window.alert(message);
  }
}

function setSerial(value) {
  $("serial").value = String(value || "").trim();
}

/* ===============================
   2. QR CODE
================================ */

function scanQR() {
  if (!tg?.showScanQrPopup) {
    alertUser("ماسح QR غير متاح");
    return;
  }

  tg.showScanQrPopup(
    { text: "وجّه الكاميرا نحو QR Code" },
    scannedText => {

      if (!scannedText) return false;

      setSerial(scannedText);

      tg.closeScanQrPopup?.();

      return true;
    }
  );
}

/* ===============================
   3. BARCODE
================================ */

let barcodeScanner = null;
let barcodeBusy = false;
let barcodeDetected = false;

function barcodeStatus(message) {
  $("barcodeStatus").textContent = message;
}

function getBarcodeScanner() {
  if (barcodeScanner) return barcodeScanner;

  if (!window.Html5Qrcode) {
    throw new Error("مكتبة Barcode غير متاحة");
  }

  const F = Html5QrcodeSupportedFormats;

  barcodeScanner = new Html5Qrcode(
    "barcodeReader",
    {
      formatsToSupport: [
        F.CODE_128,
        F.CODE_39,
        F.CODE_93,
        F.EAN_13,
        F.EAN_8,
        F.UPC_A
      ],
      verbose: false
    }
  );

  return barcodeScanner;
}

async function scanBarcode() {
  if (barcodeBusy || barcodeScanner?.isScanning) return;

  barcodeBusy = true;
  barcodeDetected = false;
  $("barcodePanel").hidden = false;

  try {
    const scanner = getBarcodeScanner();

    barcodeStatus("⏳ جارٍ تشغيل الكاميرا...");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 12,
        qrbox: (w, h) => ({
          width: Math.min(300, Math.floor(w * 0.9)),
          height: Math.min(110, Math.floor(h * 0.4))
        }),
        aspectRatio: 1.7778
      },
      async decodedText => {
        if (barcodeDetected || !decodedText) return;

        barcodeDetected = true;
        await barcodeSuccess(decodedText);
      },
      () => {}
    );

    if (!barcodeDetected) {
      barcodeStatus(
        "وجّه الكاميرا نحو الخطوط وانتظر القراءة."
      );
    }

  } catch (error) {
    barcodeStatus("❌ " + error.message);
  } finally {
    barcodeBusy = false;
  }
}

async function barcodeSuccess(value) {
  setSerial(value);

  await stopBarcode();

  alertUser("✅ تمت القراءة:\n" + value);
}

async function stopBarcode() {
  const scanner = barcodeScanner;

  barcodeScanner = null;

  if (scanner) {
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }

      scanner.clear();

    } catch (error) {
      console.warn("Barcode cleanup:", error);
    }
  }

  barcodeBusy = false;
  $("barcodePanel").hidden = true;
}

async function readBarcodeImage(input) {
  const file = input.files?.[0];

  if (!file || barcodeBusy) return;

  barcodeBusy = true;
  $("barcodePanel").hidden = false;

  try {
    const scanner = getBarcodeScanner();

    if (scanner.isScanning) {
      await scanner.stop();
    }

    barcodeStatus("⏳ جارٍ تحليل الصورة...");

    const value = await scanner.scanFile(file, false);

    await barcodeSuccess(value);

  } catch (error) {
    barcodeStatus(
      "⚠️ لم يتم التعرف على Barcode. جرّب صورة أوضح."
    );
  } finally {
    barcodeBusy = false;
    input.value = "";
  }
}

/* ===============================
   4. OCR
================================ */

let ocrBusy = false;

async function readSerialOCR(input) {
  const file = input.files?.[0];

  if (!file || ocrBusy) return;

  ocrBusy = true;
  input.disabled = true;

  let worker = null;

  const status = $("ocrStatus");
  const output = $("ocrText");

  $("ocrDetails").hidden = false;

  status.textContent = "⏳ جارٍ قراءة الصورة...";
  output.textContent = "";

  try {
    if (!window.Tesseract) {
      throw new Error("مكتبة OCR غير متاحة");
    }

    worker = await Tesseract.createWorker("eng");

    await worker.setParameters({
      tessedit_pageseg_mode: "11"
    });

    const result = await worker.recognize(file);

    const text = result.data.text || "";

    output.textContent =
      text.trim() || "لم يتم استخراج أي نص";

    // استخراج رقم محتمل بعد S/N أو Serial Number
    const match = text.match(
      /(?:S\s*\/\s*N|Serial\s*(?:No\.?|Number)?)\s*[:\-]?\s*([A-Z0-9-]{8,})/i
    );

    if (match) {
      setSerial(match[1]);

      status.textContent =
        "🔎 تم العثور على رقم محتمل. تحقق منه قبل الحفظ.";

    } else {
      status.textContent =
        "اكتملت القراءة. راجع النص المستخرج وأدخل الرقم الصحيح.";
    }

  } catch (error) {
    status.textContent =
      "❌ فشلت القراءة: " + error.message;

  } finally {
    if (worker) {
      try {
        await worker.terminate();
      } catch (error) {
        console.warn(error);
      }
    }

    input.disabled = false;
    input.value = "";
    ocrBusy = false;
  }
}

/* ===============================
   5. SAVE TO GOOGLE SHEETS
================================ */

let saving = false;

async function saveSAV() {
  if (saving) return;

  const serial = $("serial").value.trim();
  const issue = $("issue").value.trim();

  // التحقق من الحقول أولًا
  if (!serial || !issue) {
    alertUser("يرجى إدخال الرقم التسلسلي ووصف العطل");
    return;
  }

  if (!tg?.initData) {
    alertUser("يجب فتح التطبيق من داخل Telegram");
    return;
  }

  // تأكيد الرقم قبل الحفظ
  const confirmed = await new Promise(resolve => {
    tg.showConfirm(
      "هل تؤكد صحة الرقم التسلسلي؟\n\n" + serial,
      resolve
    );
  });

  if (!confirmed || saving) return;

  saving = true;
  $("saveButton").disabled = true;

  $("status").textContent =
    "⏳ جارٍ إرسال البيانات...";

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        initData: tg.initData,
        serial: serial,
        issue: issue
      })
    });

    // no-cors لا يسمح بقراءة نتيجة الخادم
    $("status").textContent =
      "📤 تم إرسال الطلب. تحقق من Google Sheets قبل إعادة الإرسال.";

  } catch (error) {
    $("status").textContent =
      "❌ تعذر إرسال الطلب. تحقق من الاتصال.";

  } finally {
    saving = false;
    $("saveButton").disabled = false;
  }
}

/* ===============================
   6. RESET
================================ */

async function clearForm() {
  if (saving) return;

  const confirmed = await new Promise(resolve => {
    if (tg?.showConfirm) {
      tg.showConfirm("هل تريد تفريغ البطاقة؟", resolve);
    } else {
      resolve(window.confirm("هل تريد تفريغ البطاقة؟"));
    }
  });

  if (!confirmed) return;

  await stopBarcode();

  $("serial").value = "";
  $("issue").value = "";
  $("status").textContent = "";
  $("ocrStatus").textContent = "";
  $("ocrText").textContent = "";
  $("ocrDetails").hidden = true;
}

</script>
</body>
</html>
