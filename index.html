
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>


  <title>CAD SAV</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #222);
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #2481cc;
      color: white;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h2>🔧 CAD SAV</h2>
  <p>استقبال جهاز للصيانة</p>

  <label>الرقم التسلسلي</label>
  <input id="serial" placeholder="Serial Number">
  
  <button type="button" onclick="scanQR()">
    📷 مسح QR Code
  </button>
  
  <button type="button" onclick="scanBarcode()">
    📷 مسح Barcode
  </button>


  <div id="barcodePanel" style="display:none; margin-top:12px;">
  
    <video id="barcodeVideo"
           autoplay playsinline muted
           style="width:100%; border-radius:10px;">
    </video>
  
    <p id="barcodeStatus">
      وجّه الكاميرا إلى Barcode وانتظر القراءة التلقائية.
    </p>
  
    <button type="button" onclick="captureBarcode()">
      📸 التقاط وتحليل الصورة
    </button>
  
    <button type="button" onclick="stopBarcode()">
      إلغاء المسح
    </button>
  
  </div>

  <br><br>

  <label>وصف العطل</label>
  <textarea id="issue"
            placeholder="Description de panne"></textarea>

  <button id="saveButton" onclick="saveSAV()">
    💾 حفظ في Google Sheets
  </button>

  <p id="status"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ضع هنا رابط Apps Script المنتهي بـ /exec
    const API_URL = "https://script.google.com/macros/s/AKfycbwjwfFZEjoFoFWq8_2UqucHkAKu1GGoC3JTClCLBJcHJBmPwRdD7eixObv_MkKKUQMh/exec";

    async function saveSAV() {
      const serial =
        document.getElementById("serial").value.trim();

      const issue =
        document.getElementById("issue").value.trim();

      const status =
        document.getElementById("status");

      const button =
        document.getElementById("saveButton");

      if (!serial || !issue) {
        tg.showAlert("يرجى إدخال الرقم والعطل");
        return;
      }

      if (!tg.initData) {
        tg.showAlert("افتح التطبيق من داخل Telegram");
        return;
      }

      button.disabled = true;
      status.textContent = "⏳ جارٍ إرسال البيانات...";

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            initData: tg.initData,
            serial: serial,
            issue: issue
          })
        });

        status.textContent =
          "📤 أُرسل الطلب. تحقق من Google Sheets للتأكد من الحفظ.";

      } catch (error) {
        status.textContent =
          "❌ تعذر إرسال الطلب. تحقق من الاتصال.";
      } finally {
        button.disabled = false;
      }
    }
  
  function scanQR() {
  
    if (typeof tg.showScanQrPopup !== "function") {
      tg.showAlert("ماسح QR غير متاح على هذا الجهاز");
      return;
    }
  
    tg.showScanQrPopup(
      { text: "وجّه الكاميرا نحو QR Code" },
      function(scannedText) {
  
        document.getElementById("serial").value =
          scannedText;
  
        return true;
      }
    );
  }
    
let barcodeControls = null;
let barcodeStarting = false;

async function scanBarcode() {
  if (barcodeStarting || barcodeControls) return;

  const panel = document.getElementById("barcodePanel");
  const video = document.getElementById("barcodeVideo");

  panel.style.display = "block";
  barcodeStarting = true;

  try {
    if (!window.ZXingBrowser) {
      throw new Error("مكتبة قراءة Barcode غير متاحة");
    }

    const reader =
      new ZXingBrowser.BrowserMultiFormatOneDReader();

    barcodeControls = await reader.decodeFromConstraints(
      {
        audio: false,
        video: {
          facingMode: { ideal: "environment" }
        }
      },
      video,
      (result, error, controls) => {
        if (result) {
          document.getElementById("serial").value =
            result.getText();

          controls.stop();
          barcodeControls = null;
          panel.style.display = "none";

          tg.showAlert("تمت قراءة Barcode بنجاح");
        }
      }
    );

  } catch (error) {
    panel.style.display = "none";
    tg.showAlert("تعذر تشغيل القارئ: " + error.message);
  } finally {
    barcodeStarting = false;
  }
}

function stopBarcode() {
  if (barcodeControls) {
    barcodeControls.stop();
    barcodeControls = null;
  }

  document.getElementById("barcodePanel").style.display =
    "none";
}

async function captureBarcode() {
  const video = document.getElementById("barcodeVideo");
  const status = document.getElementById("barcodeStatus");

  if (!video.videoWidth || !video.videoHeight) {
    status.textContent = "الكاميرا غير جاهزة بعد";
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const context = canvas.getContext("2d");
  context.drawImage(video, 0, 0);

  status.textContent = "⏳ جارٍ تحليل الصورة...";

  try {
    const reader =
      new ZXingBrowser.BrowserMultiFormatOneDReader();

    const result = await reader.decodeFromImageUrl(
      canvas.toDataURL("image/png")
    );

    const serial = result.getText();

    document.getElementById("serial").value = serial;

    stopBarcode();

    tg.showAlert("✅ تمت قراءة الرقم: " + serial);

  } catch (error) {
    status.textContent =
      "لم يُكتشف Barcode. قرّب الكاميرا أو حسّن الإضاءة.";
  }
}

</script>
</body>
</html>
