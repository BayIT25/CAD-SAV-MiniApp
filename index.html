<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAD SAV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root { color-scheme: light dark; }
* { box-sizing:border-box; }
body { margin:0; padding:16px; font:15px Arial,sans-serif; background:var(--tg-theme-bg-color,#fff); color:var(--tg-theme-text-color,#222); }
.container { max-width:520px; margin:0 auto; }
h2 { margin:0 0 4px; }
.version { font-size:12px; opacity:.65; margin-bottom:18px; }
label { display:block; font-weight:600; margin:14px 0 7px; }
input,textarea,button { font:inherit; width:100%; padding:12px; border-radius:9px; }
input,textarea { border:1px solid #aaa; background:var(--tg-theme-secondary-bg-color,#f7f7f7); color:var(--tg-theme-text-color,#222); }
textarea { resize:vertical; min-height:95px; }
button { border:0; margin-top:10px; cursor:pointer; background:var(--tg-theme-button-color,#2481cc); color:var(--tg-theme-button-text-color,#fff); font-weight:600; }
button:disabled { opacity:.5; cursor:default; }
.secondary { background:var(--tg-theme-secondary-bg-color,#e9edf3); color:var(--tg-theme-text-color,#222); border:1px solid #aaa; }
.serial-trigger { text-align:start; direction:ltr; font-weight:400; background:var(--tg-theme-secondary-bg-color,#f7f7f7); border:1px solid #aaa; color:var(--tg-theme-hint-color,#666); }
.serial-trigger.has-value { color:var(--tg-theme-text-color,#222); }
.status { font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
.modal[hidden], [hidden] { display:none !important; }
.modal { position:fixed; inset:0; z-index:100; background:var(--tg-theme-bg-color,#fff); overflow-y:auto; padding:16px 16px calc(22px + env(safe-area-inset-bottom)); }
.modal-inner { max-width:520px; margin:auto; }
.modal-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.modal-top h3 { margin:0; }
.modal-top button { width:auto; margin:0; padding:9px 14px; }
.methods { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:12px 0 6px; }
.methods button { margin:0; padding:12px 5px; font-size:13px; }
.panel { padding:12px; margin-top:12px; border:1px solid #aaa; border-radius:10px; }
#barcodeReader { width:100%; }
#ocrText { white-space:pre-wrap; overflow-wrap:anywhere; direction:ltr; text-align:left; }
.hint { color:var(--tg-theme-hint-color,#666); font-size:12px; margin:5px 0; }
</style>
</head>
<body>
<main class="container">
  <h2>🔧 CAD SAV</h2>
  <div class="version">Réception SAV — V1.03</div>

  <label for="serialTrigger">الرقم التسلسلي</label>
  <button type="button" id="serialTrigger" class="serial-trigger" onclick="openSerialModal()" aria-label="إدخال أو مسح الرقم التسلسلي">اضغط لإدخال الرقم أو مسحه...</button>

  <label for="issue">وصف العطل</label>
  <textarea id="issue" maxlength="1000" placeholder="Description de panne"></textarea>

  <button id="saveButton" type="button" onclick="saveSAV()">💾 حفظ في Google Sheets</button>
  <button type="button" class="secondary" onclick="clearForm()">🧹 تفريغ البطاقة</button>
  <p id="status" class="status" role="status"></p>
</main>

<section id="serialModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="serialHeading" hidden>
  <div class="modal-inner">
    <div class="modal-top">
      <h3 id="serialHeading">الرقم التسلسلي</h3>
      <button type="button" class="secondary" onclick="closeSerialModal()">✕ إغلاق</button>
    </div>
    <p class="hint">اكتب الرقم أو استخدم إحدى طرق القراءة، ثم اضغط «اعتماد الرقم».</p>
    <label for="serialDraft">Serial Number</label>
    <input id="serialDraft" dir="ltr" maxlength="120" autocomplete="off" placeholder="Serial Number">

    <div class="methods">
      <button type="button" onclick="scanQR()">📷 QR</button>
      <button type="button" onclick="scanBarcode()">📊 Barcode</button>
      <button type="button" onclick="showOCRPicker()">🔤 OCR</button>
    </div>

    <div id="barcodePanel" class="panel" hidden>
      <div id="barcodeReader"></div>
      <p id="barcodeStatus" class="status" role="status"></p>
      <label for="barcodeFile">أو اختر صورة للباركود</label>
      <input id="barcodeFile" type="file" accept="image/*" onchange="readBarcodeImage(this)">
      <button type="button" class="secondary" onclick="stopBarcode()">إغلاق الماسح</button>
    </div>

    <div id="ocrPanel" class="panel" hidden>
      <label for="ocrFile">التقط صورة أو اختر صورة للرقم المطبوع</label>
      <input id="ocrFile" type="file" accept="image/*" capture="environment" onchange="readSerialOCR(this)">
      <p id="ocrStatus" class="status" role="status"></p>
      <details id="ocrDetails" hidden>
        <summary>عرض النص المستخرج</summary>
        <pre id="ocrText"></pre>
      </details>
    </div>

    <button type="button" onclick="applySerial()">✅ اعتماد الرقم</button>
  </div>
</section>

<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbwjwfFZEjoFoFWq8_2UqucHkAKu1GGoC3JTClCLBJcHJBmPwRdD7eixObv_MkKKUQMh/exec';
const $ = id => document.getElementById(id);
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let serialValue = '';
let saving = false;
let barcodeScanner = null;
let barcodeBusy = false;
let barcodeDetected = false;
let ocrBusy = false;
let cameraStarting = false;

function alertUser(message) {
  if (tg?.showAlert && tg.initData) tg.showAlert(message);
  else window.alert(message);
}
function askUser(message) {
  return new Promise(resolve => {
    if (tg?.showConfirm && tg.initData) tg.showConfirm(message, resolve);
    else resolve(window.confirm(message));
  });
}
function displaySerial() {
  $('serialTrigger').textContent = serialValue || 'اضغط لإدخال الرقم أو مسحه...';
  $('serialTrigger').classList.toggle('has-value', Boolean(serialValue));
}
function draftSerial(value) { $('serialDraft').value = String(value || '').trim(); }
function openSerialModal() {
  draftSerial(serialValue);
  $('serialModal').hidden = false;
  document.body.style.overflow = 'hidden';
}
async function closeSerialModal() {
  if (ocrBusy) { alertUser('انتظر انتهاء قراءة الصورة أولًا'); return; }
  if (cameraStarting) { alertUser('انتظر تشغيل الكاميرا ثم أغلقها'); return; }
  await stopBarcode();
  $('serialModal').hidden = true;
  $('ocrPanel').hidden = true;
  document.body.style.overflow = '';
}
async function applySerial() {
  if (ocrBusy || cameraStarting || barcodeBusy) { alertUser('انتظر اكتمال القراءة'); return; }
  const value = $('serialDraft').value.trim();
  if (!value) { alertUser('أدخل الرقم التسلسلي أو امسحه'); return; }
  serialValue = value;
  displaySerial();
  await closeSerialModal();
}
function scanQR() {
  if (!tg?.showScanQrPopup) { alertUser('ماسح QR غير متاح على هذا الجهاز'); return; }
  tg.showScanQrPopup({text:'وجّه الكاميرا نحو QR Code'}, value => {
    if (!value) return false;
    draftSerial(value);
    tg.closeScanQrPopup?.();
    return true;
  });
}
function barcodeStatus(text) { $('barcodeStatus').textContent = text; }
function getBarcodeScanner() {
  if (barcodeScanner) return barcodeScanner;
  if (!window.Html5Qrcode || !window.Html5QrcodeSupportedFormats) throw new Error('مكتبة Barcode غير متاحة');
  const F = Html5QrcodeSupportedFormats;
  barcodeScanner = new Html5Qrcode('barcodeReader', {
    formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.UPC_A],
    verbose:false
  });
  return barcodeScanner;
}
async function scanBarcode() {
  if (barcodeBusy || cameraStarting || barcodeScanner?.isScanning) return;
  await hideOCRBeforeBarcode();
  $('barcodePanel').hidden = false;
  barcodeBusy = true;
  cameraStarting = true;
  barcodeDetected = false;
  try {
    const scanner = getBarcodeScanner();
    barcodeStatus('⏳ جارٍ تشغيل الكاميرا...');
    await scanner.start({facingMode:'environment'}, {
      fps:12,
      qrbox:(w,h)=>({width:Math.min(300,Math.floor(w*0.9)),height:Math.min(110,Math.floor(h*0.4))}),
      aspectRatio:1.7778
    }, async value => {
      if (barcodeDetected || !value) return;
      barcodeDetected = true;
      draftSerial(value);
      await stopBarcode();
      alertUser('✅ تمت قراءة الرقم. راجعه ثم اضغط اعتماد الرقم.');
    }, () => {});
    cameraStarting = false;
    if (!barcodeDetected) barcodeStatus('وجّه الكاميرا نحو الباركود وانتظر القراءة.');
  } catch (err) {
    barcodeStatus('❌ تعذر تشغيل الماسح: ' + err.message);
  } finally {
    cameraStarting = false;
    barcodeBusy = false;
  }
}
async function stopBarcode() {
  const scanner = barcodeScanner;
  barcodeScanner = null;
  if (scanner) {
    try {
      if (scanner.isScanning) await scanner.stop();
      scanner.clear();
    } catch(err) { console.warn('Barcode cleanup:',err); }
  }
  barcodeBusy = false;
  $('barcodePanel').hidden = true;
}
async function readBarcodeImage(input) {
  const file = input.files?.[0];
  if (!file || barcodeBusy || cameraStarting) return;
  barcodeBusy = true;
  try {
    const scanner = getBarcodeScanner();
    if (scanner.isScanning) await scanner.stop();
    barcodeStatus('⏳ جارٍ تحليل الصورة...');
    const value = await scanner.scanFile(file,false);
    draftSerial(value);
    await stopBarcode();
    alertUser('✅ تمت قراءة الرقم. راجعه ثم اضغط اعتماد الرقم.');
  } catch(err) {
    barcodeStatus('⚠️ لم يتم التعرف على الباركود. جرّب صورة أوضح.');
  } finally {
    barcodeBusy = false;
    input.value = '';
  }
}
async function hideOCRBeforeBarcode() { $('ocrPanel').hidden = true; }
async function showOCRPicker() {
  if (ocrBusy || cameraStarting || barcodeBusy) return;
  await stopBarcode();
  $('ocrPanel').hidden = false;
  $('ocrFile').click();
}
async function readSerialOCR(input) {
  const file = input.files?.[0];
  if (!file || ocrBusy) return;
  ocrBusy = true;
  input.disabled = true;
  let worker = null;
  $('ocrDetails').hidden = false;
  $('ocrText').textContent = 'جارٍ التحليل...';
  $('ocrStatus').textContent = '⏳ جارٍ قراءة النص...';
  try {
    if (!window.Tesseract) throw new Error('مكتبة OCR غير متاحة');
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_pageseg_mode:'11'});
    const result = await worker.recognize(file);
    const text = result.data.text || '';
    $('ocrText').textContent = text.trim() || 'لم يتم استخراج أي نص';
    const match = text.match(/(?:S\s*\/\s*N|Serial\s*(?:No\.?|Number)?)\s*[:\-]?\s*([A-Z0-9-]{8,})/i);
    if (match) {
      draftSerial(match[1]);
      $('ocrStatus').textContent = '🔎 رقم محتمل. قارنه بالملصق وصححه إن لزم، ثم اضغط اعتماد الرقم.';
    } else {
      $('ocrStatus').textContent = 'اكتملت القراءة. راجع النص وأدخل الرقم في الحقل أعلاه.';
    }
  } catch(err) {
    $('ocrStatus').textContent = '❌ تعذرت القراءة: '+err.message;
  } finally {
    if (worker) { try { await worker.terminate(); } catch(err) { console.warn(err); } }
    input.disabled = false;
    input.value = '';
    ocrBusy = false;
  }
}
async function saveSAV() {
  if (saving) return;
  const serial = serialValue.trim();
  const issue = $('issue').value.trim();
  if (!serial || !issue) { alertUser('يرجى إدخال الرقم التسلسلي ووصف العطل'); return; }
  if (!tg?.initData) { alertUser('افتح التطبيق من داخل Telegram'); return; }
  saving = true;
  $('saveButton').disabled = true;
  try {
    const confirmed = await askUser('هل تؤكد صحة الرقم التسلسلي؟\n\n'+serial);
    if (!confirmed) return;
    $('status').textContent = '⏳ جارٍ إرسال البيانات...';
    await fetch(API_URL, {
      method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({initData:tg.initData,serial,issue})
    });
    $('status').textContent = '📤 أُرسل الطلب. تحقق من Google Sheets قبل إعادة الإرسال.';
  } catch(err) {
    $('status').textContent = '❌ تعذر إرسال الطلب. تحقق من الاتصال.';
  } finally {
    saving = false;
    $('saveButton').disabled = false;
  }
}
async function clearForm() {
  if (saving || ocrBusy || cameraStarting) return;
  if (!(await askUser('هل تريد تفريغ البطاقة؟'))) return;
  await stopBarcode();
  serialValue = '';
  draftSerial('');
  displaySerial();
  $('issue').value = '';
  $('status').textContent = '';
  $('ocrStatus').textContent = '';
  $('ocrText').textContent = '';
  $('ocrDetails').hidden = true;
}
displaySerial();
</script>
</body>
</html>
