<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAD SAV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:15px Arial,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#222)}
main,.modal-inner{max-width:520px;margin:auto}h2{margin:0 0 4px}.version{font-size:12px;opacity:.65;margin-bottom:18px}label{display:block;font-weight:600;margin:14px 0 7px}input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:9px}input,textarea{border:1px solid #aaa;background:var(--tg-theme-secondary-bg-color,#f7f7f7);color:var(--tg-theme-text-color,#222)}textarea{resize:vertical;min-height:92px}button{border:0;margin-top:10px;cursor:pointer;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-weight:600}button:disabled{opacity:.5;cursor:default}.secondary{background:var(--tg-theme-secondary-bg-color,#e9edf3);color:var(--tg-theme-text-color,#222);border:1px solid #aaa}.serial-trigger{text-align:start;direction:ltr;font-weight:400;background:var(--tg-theme-secondary-bg-color,#f7f7f7);border:1px solid #aaa;color:var(--tg-theme-hint-color,#666)}.serial-trigger.has-value{color:var(--tg-theme-text-color,#222)}.status{font-size:13px;line-height:1.6;overflow-wrap:anywhere}[hidden]{display:none!important}.modal{position:fixed;inset:0;z-index:100;background:var(--tg-theme-bg-color,#fff);overflow-y:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-top h3{margin:0}.modal-top button{width:auto;margin:0}.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 6px}.methods button{margin:0;padding:12px 5px;font-size:13px}.panel{padding:12px;margin-top:12px;border:1px solid #aaa;border-radius:10px}#barcodeReader{width:100%}#ocrText{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left}.hint{color:var(--tg-theme-hint-color,#666);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{border:1px solid #bbb;border-radius:9px;padding:11px;margin-top:12px}.result b{display:block;margin-bottom:5px}.success{border-color:#1d9b60}.warning{border-color:#d39516}
</style>
</head>
<body>
<main>
<h2>🔧 CAD SAV</h2><div class="version">Réception SAV — V1.04</div>
<label for="serialTrigger">الرقم التسلسلي</label><button type="button" id="serialTrigger" class="serial-trigger" onclick="openSerialModal()">اضغط لإدخال الرقم أو مسحه...</button>
<div id="lookupBox" class="result" hidden><b id="lookupTitle"></b><div class="status" id="lookupText"></div></div>
<div class="grid"><div><label for="customer">العميل</label><input id="customer" maxlength="120" placeholder="Nom du client"></div><div><label for="phone">رقم الهاتف</label><input id="phone" type="tel" maxlength="50" dir="ltr" placeholder="Téléphone"></div></div>
<div class="grid"><div><label for="product">نوع الجهاز</label><input id="product" maxlength="120" placeholder="Produit"></div><div><label for="brand">العلامة</label><input id="brand" maxlength="120" placeholder="Marque"></div></div>
<label for="model">الموديل</label><input id="model" maxlength="120" dir="ltr" placeholder="Modèle">
<label for="issue">وصف العطل</label><textarea id="issue" maxlength="1000" placeholder="Description de panne"></textarea>
<button id="saveButton" type="button" onclick="saveSAV()">💾 تسجيل الاستقبال</button>
<button type="button" class="secondary" onclick="clearForm()">🧹 تفريغ البطاقة</button>
<p id="status" class="status" role="status"></p>
</main>
<section id="serialModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="serialHeading" hidden><div class="modal-inner">
<div class="modal-top"><h3 id="serialHeading">الرقم التسلسلي</h3><button class="secondary" type="button" onclick="closeSerialModal()">✕ إغلاق</button></div>
<p class="hint">اكتب الرقم أو امسحه ثم اضغط «اعتماد الرقم».</p>
<label for="serialDraft">Serial Number</label><input id="serialDraft" dir="ltr" maxlength="120" autocomplete="off" placeholder="Serial Number">
<div class="methods"><button type="button" onclick="scanQR()">📷 QR</button><button type="button" onclick="scanBarcode()">📊 Barcode</button><button type="button" onclick="showOCRPicker()">🔤 OCR</button></div>
<div id="barcodePanel" class="panel" hidden><div id="barcodeReader"></div><p id="barcodeStatus" class="status"></p><label for="barcodeFile">أو اختر صورة للباركود</label><input id="barcodeFile" type="file" accept="image/*" onchange="readBarcodeImage(this)"><button type="button" class="secondary" onclick="stopBarcode()">إغلاق الماسح</button></div>
<div id="ocrPanel" class="panel" hidden><label for="ocrFile">التقط صورة الرقم المطبوع</label><input id="ocrFile" type="file" accept="image/*" capture="environment" onchange="readSerialOCR(this)"><p id="ocrStatus" class="status"></p><details id="ocrDetails" hidden><summary>عرض النص المستخرج</summary><pre id="ocrText"></pre></details></div>
<button type="button" onclick="applySerial()">✅ اعتماد الرقم</button>
</div></section>
<script>
'use strict';
const API='https://cad-sav-api-176972661374.europe-west1.run.app';
const $=id=>document.getElementById(id), tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}
let serialValue='', saving=false, lookupVersion=0, lookupResult=null;
let requestId=crypto.randomUUID(), barcodeScanner=null,barcodeBusy=false,barcodeDetected=false, cameraStarting=false,ocrBusy=false;
function message(text){if(tg?.showAlert && tg.initData)tg.showAlert(text);else alert(text)}
function confirmAction(text){return new Promise(done=>{if(tg?.showConfirm && tg.initData)tg.showConfirm(text,done);else done(confirm(text))})}
function displaySerial(){$('serialTrigger').textContent=serialValue||'اضغط لإدخال الرقم أو مسحه...';$('serialTrigger').classList.toggle('has-value',!!serialValue)}
function openSerialModal(){$('serialDraft').value=serialValue;$('serialModal').hidden=false;document.body.style.overflow='hidden'}
async function closeSerialModal(){if(ocrBusy||cameraStarting){message('انتظر اكتمال القراءة');return}await stopBarcode();$('serialModal').hidden=true;$('ocrPanel').hidden=true;document.body.style.overflow=''}
async function applySerial(){if(ocrBusy||cameraStarting||barcodeBusy){message('انتظر اكتمال القراءة');return}const value=$('serialDraft').value.trim();if(!value){message('أدخل الرقم التسلسلي');return}const changed=serialValue!==value;serialValue=value;displaySerial();await closeSerialModal();if(changed){requestId=crypto.randomUUID();await lookupSerial()}}
function scanQR(){if(!tg?.showScanQrPopup){message('ماسح QR غير متاح');return}tg.showScanQrPopup({text:'وجّه الكاميرا نحو QR Code'},value=>{if(!value)return false;$('serialDraft').value=value;tg.closeScanQrPopup?.();return true})}
function barcodeStatus(s){$('barcodeStatus').textContent=s}
function barcodeReader(){if(barcodeScanner)return barcodeScanner;if(!window.Html5Qrcode)throw Error('مكتبة Barcode غير متاحة');const F=Html5QrcodeSupportedFormats;barcodeScanner=new Html5Qrcode('barcodeReader',{formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.UPC_A],verbose:false});return barcodeScanner}
async function scanBarcode(){if(barcodeBusy||cameraStarting||barcodeScanner?.isScanning)return;$('ocrPanel').hidden=true;$('barcodePanel').hidden=false;barcodeBusy=true;cameraStarting=true;barcodeDetected=false;try{const s=barcodeReader();barcodeStatus('جارٍ تشغيل الكاميرا...');await s.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(300,Math.floor(w*.9)),height:Math.min(110,Math.floor(h*.4))}),aspectRatio:1.7778},async value=>{if(barcodeDetected||!value)return;barcodeDetected=true;$('serialDraft').value=value;await stopBarcode();message('تمت القراءة. راجع الرقم ثم اعتمده.')},()=>{});if(!barcodeDetected)barcodeStatus('وجّه الكاميرا نحو الباركود وانتظر القراءة.')}catch(e){barcodeStatus('تعذر تشغيل الكاميرا: '+e.message)}finally{cameraStarting=false;barcodeBusy=false}}
async function stopBarcode(){const s=barcodeScanner;barcodeScanner=null;if(s){try{if(s.isScanning)await s.stop();s.clear()}catch(e){console.warn(e)}}barcodeBusy=false;$('barcodePanel').hidden=true}
async function readBarcodeImage(input){const f=input.files?.[0];if(!f||barcodeBusy||cameraStarting)return;barcodeBusy=true;try{const s=barcodeReader();if(s.isScanning)await s.stop();barcodeStatus('جارٍ تحليل الصورة...');const value=await s.scanFile(f,false);$('serialDraft').value=value;await stopBarcode();message('تمت القراءة. راجع الرقم ثم اعتمده.')}catch(e){barcodeStatus('تعذرت القراءة. جرّب صورة أوضح.')}finally{barcodeBusy=false;input.value=''}}
async function showOCRPicker(){if(ocrBusy||cameraStarting||barcodeBusy)return;await stopBarcode();$('ocrPanel').hidden=false;$('ocrFile').click()}
async function readSerialOCR(input){const file=input.files?.[0];if(!file||ocrBusy)return;ocrBusy=true;input.disabled=true;let worker;const output=$('ocrText');$('ocrDetails').hidden=false;$('ocrStatus').textContent='جارٍ قراءة الصورة...';output.textContent='';try{worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'11'});const t=(await worker.recognize(file)).data.text||'';output.textContent=t.trim()||'لم يتم استخراج أي نص';const m=t.match(/(?:S\s*\/\s*N|Serial\s*(?:No\.?|Number)?)\s*[:\-]?\s*([A-Z0-9-]{8,})/i);if(m){$('serialDraft').value=m[1];$('ocrStatus').textContent='تم استخراج رقم محتمل؛ راجعه قبل الاعتماد.'}else $('ocrStatus').textContent='راجع النص المستخرج وأدخل الرقم الصحيح.'}catch(e){$('ocrStatus').textContent='تعذرت القراءة: '+e.message}finally{if(worker)try{await worker.terminate()}catch{}input.disabled=false;input.value='';ocrBusy=false}}
async function apiCall(path,payload){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...payload})});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'HTTP_'+r.status);return x}
async function lookupSerial(){const v=++lookupVersion;lookupResult=null;$('lookupBox').hidden=false;$('lookupBox').className='result';$('lookupTitle').textContent='⏳ جارٍ البحث عن الجهاز...';$('lookupText').textContent='';try{const x=await apiCall('/api/lookup',{serial:serialValue});if(v!==lookupVersion)return;lookupResult=x;if(x.kind==='NEW_DEVICE'){$('lookupBox').classList.add('success');$('lookupTitle').textContent='✅ جهاز جديد';$('lookupText').textContent='لا توجد ملفات صيانة سابقة.'}else if(x.kind==='OPEN_CASE'){$('lookupBox').classList.add('warning');$('lookupTitle').textContent='⚠️ يوجد ملف صيانة مفتوح';$('lookupText').textContent=`عدد الملفات السابقة: ${x.totalCases} — الملف: ${x.openCases[0]?.caseId||'غير محدد'}`}else{$('lookupTitle').textContent='📋 صيانة سابقة';$('lookupText').textContent=`عدد الملفات السابقة: ${x.totalCases} — آخر ملف: ${x.lastCase?.caseId||'غير محدد'}`}}catch(e){if(v!==lookupVersion)return;$('lookupTitle').textContent='تعذر البحث';$('lookupText').textContent=e.message==='INVALID_TELEGRAM_AUTH'?'أعد فتح التطبيق من Telegram ثم جرّب.':'تحقق من الاتصال ثم اعتمد الرقم مجددًا.'}}
async function saveSAV(){if(saving)return;const serial=serialValue.trim(),issue=$('issue').value.trim();if(!serial||!issue){message('أدخل الرقم التسلسلي ووصف العطل');return}if(!tg?.initData){message('افتح التطبيق من Telegram');return}saving=true;$('saveButton').disabled=true;try{if(lookupResult?.kind==='OPEN_CASE'){if(!await confirmAction('يوجد ملف مفتوح لنفس الجهاز. هل تريد إنشاء ملف آخر؟'))return}if(!await confirmAction('تأكيد استقبال الجهاز برقم:\n'+serial))return;$('status').textContent='⏳ جارٍ حفظ ملف الصيانة...';const result=await apiCall('/api/cases',{requestId,serial,issue,customer:$('customer').value.trim(),phone:$('phone').value.trim(),product:$('product').value.trim(),brand:$('brand').value.trim(),model:$('model').value.trim()});$('status').textContent='✅ تم تسجيل ملف SAV: '+result.caseId+(result.duplicate?' (مسجل مسبقًا)':'');$('saveButton').disabled=true;lookupResult=null}catch(e){$('status').textContent='❌ لم يتم تأكيد الحفظ: '+e.message+' — أعد المحاولة دون تفريغ البطاقة.'}finally{saving=false;if(!$('status').textContent.startsWith('✅'))$('saveButton').disabled=false}}
async function clearForm(){if(saving||ocrBusy||cameraStarting)return;if(!await confirmAction('تفريغ بطاقة الاستقبال؟'))return;await stopBarcode();serialValue='';requestId=crypto.randomUUID();lookupVersion++;lookupResult=null;displaySerial();$('serialDraft').value='';['customer','phone','product','brand','model','issue'].forEach(k=>$(k).value='');$('lookupBox').hidden=true;$('status').textContent='';$('ocrStatus').textContent='';$('ocrText').textContent='';$('ocrDetails').hidden=true;$('saveButton').disabled=false}
displaySerial();
</script>
</body>
</html>
