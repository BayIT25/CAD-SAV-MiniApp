
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <title>CAD SAV</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #222);
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #2481cc;
      color: white;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h2>🔧 CAD SAV</h2>
  <p>استقبال جهاز للصيانة</p>

  <label>الرقم التسلسلي</label>
  <input id="serial" placeholder="Serial Number">
  
  <button type="button" onclick="scanQR()">
    📷 مسح QR Code
  </button>
  
  <button type="button" onclick="scanBarcode()">
    📷 مسح Barcode
  </button>

  <div id="barcodePanel" style="display:none; margin-top:12px;">
  
    <div id="barcodeReader" style="width:100%;"></div>
  
    <p id="barcodeStatus">
      وجّه الكاميرا نحو الخطوط وانتظر القراءة.
    </p>
  
    <label>أو اختر صورة واضحة للباركود:</label>
    <input
      id="barcodeFile"
      type="file"
      accept="image/*"
      onchange="readBarcodeImage(this)"
    >
  
    <button type="button" onclick="stopBarcode()">
      إغلاق الماسح
    </button>
  
  </div>

  <br><br>

  <label>وصف العطل</label>
  <textarea id="issue"
            placeholder="Description de panne"></textarea>

  <button id="saveButton" onclick="saveSAV()">
    💾 حفظ في Google Sheets
  </button>

  <p id="status"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ضع هنا رابط Apps Script المنتهي بـ /exec
    const API_URL = "https://script.google.com/macros/s/AKfycbwjwfFZEjoFoFWq8_2UqucHkAKu1GGoC3JTClCLBJcHJBmPwRdD7eixObv_MkKKUQMh/exec";

    async function saveSAV() {
      const serial =
        document.getElementById("serial").value.trim();

      const issue =
        document.getElementById("issue").value.trim();

      const status =
        document.getElementById("status");

      const button =
        document.getElementById("saveButton");

      if (!serial || !issue) {
        tg.showAlert("يرجى إدخال الرقم والعطل");
        return;
      }

      if (!tg.initData) {
        tg.showAlert("افتح التطبيق من داخل Telegram");
        return;
      }

      button.disabled = true;
      status.textContent = "⏳ جارٍ إرسال البيانات...";

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            initData: tg.initData,
            serial: serial,
            issue: issue
          })
        });

        status.textContent =
          "📤 أُرسل الطلب. تحقق من Google Sheets للتأكد من الحفظ.";

      } catch (error) {
        status.textContent =
          "❌ تعذر إرسال الطلب. تحقق من الاتصال.";
      } finally {
        button.disabled = false;
      }
    }
  
  function scanQR() {
  
    if (typeof tg.showScanQrPopup !== "function") {
      tg.showAlert("ماسح QR غير متاح على هذا الجهاز");
      return;
    }
  
    tg.showScanQrPopup(
      { text: "وجّه الكاميرا نحو QR Code" },
      function(scannedText) {
  
        document.getElementById("serial").value =
          scannedText;
  
        return true;
      }
    );
  }
    
let barcodeControls = null;
let barcodeStarting = false;


let barcodeScanner = null;
let barcodeBusy = false;
let barcodeDetected = false;

function barcodeStatus(text) {
  document.getElementById("barcodeStatus").textContent = text;
}

function getBarcodeScanner() {
  if (!barcodeScanner) {
    const F = Html5QrcodeSupportedFormats;

    barcodeScanner = new Html5Qrcode(
      "barcodeReader",
      {
        formatsToSupport: [
          F.CODE_128,
          F.CODE_39,
          F.CODE_93,
          F.EAN_13,
          F.EAN_8,
          F.UPC_A
        ],
        verbose: false
      }
    );
  }
  return barcodeScanner;
}

async function scanBarcode() {
  if (barcodeBusy) return;
  barcodeBusy = true;
  barcodeDetected = false;

  document.getElementById("barcodePanel").style.display = "block";

  try {
    const scanner = getBarcodeScanner();

    barcodeStatus("جارٍ تشغيل الكاميرا...");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 12,
        qrbox: (w, h) => ({
          width: Math.min(300, Math.floor(w * 0.9)),
          height: Math.min(110, Math.floor(h * 0.4))
        }),
        aspectRatio: 1.7778
      },
      async (decodedText) => {
        if (barcodeDetected) return;
        barcodeDetected = true;
        await barcodeSuccess(decodedText);
      },
      () => {}
    );

    if (!barcodeDetected) {
      barcodeStatus("قرّب الباركود حتى تظهر الخطوط واضحة داخل الإطار.");
    }

  } catch (error) {
    barcodeStatus("تعذر تشغيل الكاميرا: " + error.message);
  } finally {
    barcodeBusy = false;
  }
}

async function barcodeSuccess(value) {
  document.getElementById("serial").value = value;

  await stopBarcode();

  tg.showAlert("تمت القراءة: " + value);
}

async function stopBarcode() {
  const scanner = barcodeScanner;

  if (scanner) {
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }
      scanner.clear();
    } catch (error) {
      console.warn(error);
    }
  }

  barcodeScanner = null;
  barcodeBusy = false;

  document.getElementById("barcodePanel").style.display = "none";
}

async function readBarcodeImage(input) {
  const file = input.files?.[0];
  if (!file) return;

  try {
    barcodeStatus("جارٍ تحليل الصورة...");

    const scanner = getBarcodeScanner();

    if (scanner.isScanning) {
      await scanner.stop();
    }

    const value = await scanner.scanFile(file, false);

    await barcodeSuccess(value);

  } catch (error) {
    barcodeStatus(
      "لم يتم التعرف على الباركود. جرب صورة أوضح."
    );
  } finally {
    input.value = "";
  }
}


</script>
</body>
</html>
